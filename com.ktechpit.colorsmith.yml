app-id: com.ktechpit.colorsmith
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: colorsmith

finish-args:
  - --share=ipc
  - --device=dri
  - --socket=fallback-x11
  - --socket=wayland

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/*.la
  - /lib/*.a
  - /share/man

modules:
  - name: colorsmith
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
     - type: git
       url: https://github.com/keshavbhatt/colorsmith.git
       tag: v1.0.1
       commit: 434a54dcd8dfb6075daa252e81c63ba710045f72
       x-checker-data:
          type: git
          tag-pattern: ^(v[\d.]+)$
