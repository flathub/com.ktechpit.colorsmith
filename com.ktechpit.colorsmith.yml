app-id: com.ktechpit.colorsmith
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: colorsmith

finish-args:
  - --share=ipc
  - --device=dri
  - --socket=fallback-x11
  - --socket=wayland

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/*.la
  - /lib/*.a
  - /share/man

modules:
  - name: colorsmith
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
     - type: git
       url: https://github.com/keshavbhatt/colorsmith.git
       tag: v1.1.0
       commit: bee669e1afa734fa8f61bc1f9cb7fbf23ae2e839
       x-checker-data:
          type: git
          tag-pattern: ^(v[\d.]+)$
